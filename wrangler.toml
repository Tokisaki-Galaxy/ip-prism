name = "ip-prism"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# ── Free plan is sufficient: 10ms CPU/req, 128MB mem. DBs live in R2
# (5TB/object cap, 10GB free) and are cached isolate-globally after cold start. ──

# Daily data refresh — runs at an odd minute to blend with general traffic.
# Free plan allows up to 5 cron triggers per account.
[triggers]
crons = ["17 3 * * *"]

# ── Bindings (create before first deploy) ──────────────────────────────────
#   wrangler r2 bucket create ip-prism-db
#   wrangler kv namespace create CACHE
#   wrangler kv namespace create CACHE --preview   # → fill preview_id below

[[r2_buckets]]
binding = "DB"
bucket_name = "ip-prism-db"

[[kv_namespaces]]
binding = "CACHE"
id = "16cc44dc7e8046edbe7598268564e1a6"
preview_id = "1baa374dc25443ccb4d6cac37f344111"

# ── Non-secret vars (secrets via `wrangler secret put`) ─────────────────────
#   wrangler secret put API_KEY          # X-API-Key header value (caller auth)
#   wrangler secret put IPINFO_TOKEN     # ipinfo.io bearer token
#   wrangler secret put AMAP_KEY         # restapi.amap.com key
[vars]
DATA_PRIMARY_URL = "https://raw.githubusercontent.com/FW27623/qqwry/main/qqwry.dat"
DATA_FALLBACK_URL = "https://raw.githubusercontent.com/metowolf/qqwry.dat/main/qqwry.dat"
DATA_OBJECT_KEY = "qqwry.dat"
# GeoLite2 daily mirrors (GitHub release asset direct links, no auth needed).
# Loyalsoldier Country.mmdb is the hardcoded fallback for the country pipeline.
# Isolate memory budget (all cached isolate-globally):
#   qqwry ~11MB + City ~62MB + ASN ~11.5MB ≈ 85MB / 128MB
#   (City active → Country.mmdb is not loaded; without City → Country ~8MB.)
GEOLITE_COUNTRY_URL = "https://github.com/P3TERX/GeoLite.mmdb/releases/latest/download/GeoLite2-Country.mmdb"
GEOLITE_ASN_URL = "https://github.com/P3TERX/GeoLite.mmdb/releases/latest/download/GeoLite2-ASN.mmdb"
GEOLITE_CITY_URL = "https://github.com/P3TERX/GeoLite.mmdb/releases/latest/download/GeoLite2-City.mmdb"
GEOLITE_COUNTRY_KEY = "GeoLite2-Country.mmdb"
GEOLITE_ASN_KEY = "GeoLite2-ASN.mmdb"
GEOLITE_CITY_KEY = "GeoLite2-City.mmdb"
CACHE_TTL_SECONDS = "2592000"
MAX_BATCH = "20"

# ── Observability ───────────────────────────────────────────────────────────
[observability]
enabled = true

[placement]
mode = "smart"
